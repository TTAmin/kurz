groups:
  - name: kurz
    rules:
      - alert: KurzDown
        expr: up{job="kurz"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "kurz instance {{ $labels.instance }} is down"

      # Only user traffic counts: health checks and scrapes would dilute the ratio.
      # And a ratio of almost nothing is noise: two failed requests while nobody uses
      # the service are 100% errors. At least 5 failures in 5 minutes are required.
      - alert: KurzHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="kurz", route!~"/healthz|/readyz|/metrics|/favicon.ico", status=~"5.."}[5m]))
              / sum(rate(http_requests_total{job="kurz", route!~"/healthz|/readyz|/metrics|/favicon.ico"}[5m]))
          ) > 0.05
          and sum(increase(http_requests_total{job="kurz", route!~"/healthz|/readyz|/metrics|/favicon.ico", status=~"5.."}[5m])) >= 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of user requests fail with a 5xx"

      # A 95th percentile of two requests is just the slower of the two; it needs at
      # least 20 redirects in 5 minutes to mean anything.
      - alert: KurzSlowRedirects
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="kurz", route="/{code}"}[5m]))
          ) > 0.25
          and sum(increase(http_request_duration_seconds_count{job="kurz", route="/{code}"}[5m])) >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 redirect latency above 250 ms"
