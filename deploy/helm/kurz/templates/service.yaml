apiVersion: v1
kind: Service
metadata:
  name: {{ include "kurz.fullname" . }}
  labels:
    {{- include "kurz.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kurz.appSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
