apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kurz.fullname" . }}-test
  labels:
    {{- include "kurz.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: readyz
      image: busybox:1.37
      command: ["wget", "-qO-", "http://{{ include "kurz.fullname" . }}:{{ .Values.service.port }}/readyz"]
