[project]
name = "kurz"
version = "0.1.0"
description = "A small URL shortener, wrapped in a production-style DevOps toolchain."
requires-python = ">=3.13"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the intended pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
