name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCAL_IMAGE: kurz:ci

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kurz
          POSTGRES_PASSWORD: kurz
          POSTGRES_DB: kurz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kurz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest against Postgres
        env:
          KURZ_DATABASE_URL: postgresql+psycopg://kurz:kurz@localhost:5432/kurz
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  lint-infra:
    name: Lint Helm, Terraform, Prometheus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Helm lint and schema validation
        run: |
          helm lint deploy/helm/kurz
          helm lint deploy/helm/kurz --set ingress.enabled=true,autoscaling.enabled=true
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          helm template kurz deploy/helm/kurz --set ingress.enabled=true,autoscaling.enabled=true \
            | ./kubeconform -strict -summary
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Terraform fmt and validate
        working-directory: infra/terraform/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v2.55.1 \
            check config /m/prometheus.yml

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: ${{ env.LOCAL_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  scan:
    name: Security scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Trivy image scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
      - name: Upload to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Trivy image scan (gate on fixable criticals)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy misconfiguration scan (Dockerfile, Helm, Terraform)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"

  e2e:
    name: Deploy to kind & smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load -i "${{ runner.temp }}/image.tar"
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: kurz
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Load image into kind
        run: kind load docker-image "$LOCAL_IMAGE" --name kurz
      - name: Helm install
        run: |
          helm install kurz deploy/helm/kurz \
            --set image.repository=kurz,image.tag=ci,image.pullPolicy=Never \
            --wait --timeout 5m
      - name: Helm test
        run: helm test kurz --logs
      - name: Smoke test
        run: |
          kubectl port-forward svc/kurz 8080:80 >/dev/null 2>&1 &
          bash scripts/smoke-test.sh http://localhost:8080
      - name: Zero-downtime rolling update
        run: bash scripts/rollout-test.sh kurz deploy/helm/kurz
      - name: Smoke test after the update
        run: |
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/kurz 8080:80 >/dev/null 2>&1 &
          bash scripts/smoke-test.sh http://localhost:8080
      - name: Debug output
        if: failure()
        run: |
          kubectl get all,pvc
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/name=kurz --all-containers --tail=100

  publish:
    name: Publish to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [scan, e2e, lint-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load -i "${{ runner.temp }}/image.tar"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push
        id: push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kurz"
          for tag in "sha-${GITHUB_SHA::7}" latest; do
            docker tag "$LOCAL_IMAGE" "$image:$tag"
            docker push "$image:$tag"
          done
          echo "ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:latest")" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign image (keyless, Sigstore)
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"
